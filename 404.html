<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Página não encontrada | EverSats</title>
  <style>
    :root { --bg:#ffffff; --fg:#1a1a1a; --accent:#f7931a; }

    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; text-align:center; padding:1.5rem; }
    h1 { font-size:4rem; margin:0; color:var(--accent); }
    p { max-width:32rem; line-height:1.5; }
    a { display:inline-block; margin:.4rem; padding:.7rem 1.2rem; border-radius:6px; text-decoration:none;
        background:var(--accent); color:#000; font-weight:600; }
    a.sec { background:transparent; color:var(--fg); border:1px solid currentColor; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>Não encontramos esta página. Ela pode ter sido movida ou o endereço está incorreto.</p>

</body>
</html>
